{{define "title"}}Posts{{end}}

{{define "main"}}
<!-- Posts -->
  {{if .Page.Posts}}
    <section class="posts-list" aria-label="Blog posts">
    {{range .Page.Posts}}
      <article class="post-item">
        <h2 class="post-title">
          <a href="/posts/{{.Page.Metadata.Slug}}">{{.Page.Metadata.Title}}</a>
        </h2>
        <time class="post-date" datetime="{{.Page.Metadata.Date.Format "2006-01-02"}}">
          {{.Page.Metadata.Date.Format "January 2, 2006"}}
        </time>
        <p class="post-summary">{{.Page.Metadata.Summary}}</p>
        
      </article>
    {{end}}
  </section>
  {{else}}
    <h2>No posts found</h2>
  {{end}}
{{end}}
