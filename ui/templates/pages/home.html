{{define "title"}}Home{{end}}

{{define "main"}}
  <header class="blog-header">
    <h1>Josh builds stuff</h1>
    <p class="subtitle">
      A place to keep track of the all the various projects and tech that interests me.
    </p>
  </header>

  <section class="posts-list" aria-label="Blog posts">
    {{range .Posts}}
      <article class="post-item"> 
        <h2 class="post-title">
          <a href="/posts/{{.Metadata.Slug}}">{{.Metadata.Title}}</a>
        </h2>
        <time class="post-date" datetime="{{.Metadata.Date.Format "2006-01-02"}}">
          {{.Metadata.Date.Format "January 2, 2006"}}
        </time>
      </article>
    {{end}}
  </section>
{{end}}
