{{define "title"}}Search Results{{end}}

{{define "main"}}
<h1>Search Results for "{{.Page.Term}}"</h1>
{{if .Page.Posts}}
  <ul>
    {{range .Page.Posts}}
      <li>
        <a href="/posts/{{.Metadata.Slug}}">{{.Metadata.Title}}</a>
        <span>({{.Metadata.Date.Format "Jan 2, 2006"}})</span>
      </li>
    {{end}}
  </ul>
{{else}}
  <p>No posts found.</p>
{{end}}
{{end}}
