services:
  blogo:
    image: ghcr.io/joshhartwig/blogo:latest
    container_name: blogo
    restart: unless-stopped
    ports:
      - "3999:3999"
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./content:/content:ro
      - ./themes:/themes:ro
    command: ["serve", "--config", "/config/config.toml", "--addr", ":3999"]
